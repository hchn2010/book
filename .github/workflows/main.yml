name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5  # 升级到 v5，消除警告
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # ========== 以下是新增的关键修复步骤 ==========
    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses

    - name: Install specific SDK and Build Tools
      run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
    # ===========================================

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with stacktrace
      run: ./gradlew assembleDebug --stacktrace  # 加 --stacktrace 方便排查深层问题

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
