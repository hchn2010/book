name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK (platform 36, build-tools 36.0.0)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # The :app module signs debug builds with a custom keystore at
      # ${rootDir}/debug.keystore, which is NOT committed. Generate it here.
      - name: Generate debug keystore
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # The repo does not commit the Gradle wrapper (gradlew / gradle-wrapper.jar),
      # so we install Gradle explicitly and build with the `gradle` CLI instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      # compileSdk = release(36); configuration-cache disabled to avoid
      # incompatibilities with the applied plugins (secrets/google-services/roborazzi).
      - name: Build Debug APK
        run: gradle assembleDebug --no-configuration-cache --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
